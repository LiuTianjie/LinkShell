<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LinkShell 隔离预览</title>
    <style>
      html,
      body,
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        margin: 0;
      }
      body {
        font: 14px system-ui;
      }
      #note {
        padding: 24px;
        color: #666;
      }
      iframe {
        display: none;
      }
    </style>
  </head>
  <body>
    <p id="note">正在准备隔离预览…</p>
    <iframe
      id="page"
      title="开发网页"
      sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads allow-pointer-lock"
      allow="autoplay; fullscreen"
    ></iframe>
    <script src="/preview/bridge.js"></script>
  </body>
</html>
