name: linkshell-gateway
image: nickname4th/linkshell-gateway:0.6.6
region: cn
exposure: cn-edge
domain: gateway.itool.tech
port: 8787
publishPort: 8787
replicas: 1
# The v2 relay's pairings and keys (SQLite); losing them unpairs every phone.
volumes:
  - linkshell-gateway-relay:/data
# The relay holds at most a few MB per busy connection; the ceiling is headroom
# for many of them (the image's Node heap is capped at 512 MB to fit under it).
resources:
  reservations:
    memory: 256M
  limits:
    memory: 768M
env:
  PORT: "8787"
  RELAY_DATA_PATH: /data/relay.db
  AUTH_REQUIRED: "true"
  # Connections arrive through the edge, so the limit per address is a limit on everyone at once:
  # high enough that all of them reconnecting after a deploy get back in.
  WS_CONNECT_RATE_LIMIT_MAX: "600"
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
  SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
healthcheck:
  test:
    - CMD
    - wget
    - -qO-
    - http://127.0.0.1:8787/healthz
  interval: 10s
  timeout: 3s
  retries: 3
  start_period: 10s
