services:
  gateway:
    image: nickname4th/linkshell-gateway:latest
    container_name: linkshell-gateway
    build:
      context: .
      dockerfile: packages/gateway/Dockerfile
    ports:
      - "${PORT:-8787}:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      # Pairings and machine/device keys (RELAY_DATA_PATH=/data/relay.db).
      - linkshell-gateway:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  linkshell-gateway:
