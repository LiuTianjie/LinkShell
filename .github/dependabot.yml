version: 2
updates:
  - package-ecosystem: npm
    directory: /packages/host/test/real-agents
    schedule:
      interval: weekly
    versioning-strategy: increase
    open-pull-requests-limit: 2
    groups:
      native-agent-clis:
        patterns: ["@openai/codex", "@anthropic-ai/claude-code"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    allow:
      - dependency-name: "@agentclientprotocol/claude-agent-acp"
      - dependency-name: "@agentclientprotocol/sdk"
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
    groups:
      agent-adapters:
        patterns: ["@agentclientprotocol/*", "@anthropic-ai/claude-agent-sdk"]
