name: Build iOS & Upload TestFlight

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        working-directory: apps/client

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build workspace packages
        run: pnpm -r --filter './packages/*' build
        working-directory: .

      # v2.0.1 -> version 2.0.1, build number 20001; prebuild, archive, upload.
      - name: Archive and upload to TestFlight
        run: node scripts/release.mjs ios "${GITHUB_REF#refs/tags/v}"
