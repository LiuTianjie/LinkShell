name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      # Exactly what the lockfile says: a package.json changed without it fails here, not on a user's machine.
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" build
      # Everything in TypeScript, the app included (it is checked against the packages just built).
      - run: pnpm typecheck
      - run: pnpm lint
      # apps/mac is Swift for macOS: its own checks run where it is built (pnpm --filter @linkshell/mac check).
      - run: pnpm -r --filter "!@linkshell/mac" --if-present --workspace-concurrency=1 test
