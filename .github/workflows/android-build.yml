name: Build Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, macOS]
    defaults:
      run:
        working-directory: apps/client

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Build workspace packages
        run: pnpm -r --filter './packages/*' build
        working-directory: .

      - name: Set version from tag
        id: version
        run: echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # v2.0.1 -> version 2.0.1, versionCode 20001; AAB + APK in build/release.
      - name: Build AAB and APK
        run: node scripts/release.mjs android "${{ steps.version.outputs.name }}"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: LinkShell ${{ steps.version.outputs.name }}
          files: |
            apps/client/build/release/LinkShell-${{ steps.version.outputs.name }}.aab
            apps/client/build/release/LinkShell-${{ steps.version.outputs.name }}.apk
