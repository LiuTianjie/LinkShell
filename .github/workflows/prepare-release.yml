name: Prepare release artifacts

on:
  push:
    branches: ['codex/prepare-commands-goals-tasks', 'codex/prepare-linkshell-2.3.9']
  workflow_dispatch:
    inputs:
      mobile_only:
        description: Build signed mobile artifacts only, without tests or publication
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    if: ${{ !inputs.mobile_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter './packages/*' build
      - run: pnpm typecheck && pnpm lint
      - run: pnpm -r --filter '!@linkshell/mac' --if-present --workspace-concurrency=1 test
      - name: Prepare npm packages without publishing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/npm"
          for package in wire host gateway cli; do
            pnpm --dir "packages/$package" pack --pack-destination "$GITHUB_WORKSPACE/artifacts/npm"
          done
          python3 scripts/check-release-packages.py artifacts/npm
      - name: Build web client
        run: |
          pnpm --filter @linkshell/web build
          mkdir -p artifacts/web
          tar -czf artifacts/web/linkshell-web-0.1.0.tar.gz -C apps/web/dist .
      - name: Prepare and verify gateway image without pushing
        run: |
          VERSION=$(node -p "require('./packages/gateway/package.json').version")
          docker build -f packages/gateway/Dockerfile -t "linkshell-gateway:$VERSION" .
          docker run -d --rm --name linkshell-gateway-check -p 127.0.0.1:18787:8787 --tmpfs /data:rw,mode=1777 "linkshell-gateway:$VERSION"
          trap 'docker stop linkshell-gateway-check || true' EXIT
          curl --retry 15 --retry-delay 2 --retry-connrefused -fsS http://127.0.0.1:18787/healthz > artifacts/gateway-health.json
          node -e "const fs=require('fs'); const h=JSON.parse(fs.readFileSync('artifacts/gateway-health.json')); if(!h.ok||h.version!==require('./packages/gateway/package.json').version) process.exit(1)"
          curl -fsS http://127.0.0.1:18787/ | grep -q 'id="root"'
          curl -fsS http://127.0.0.1:18787/config.js | grep -q '"deployment":"self-hosted"'
          mkdir -p artifacts/docker
          docker save "linkshell-gateway:$VERSION" | gzip > "artifacts/docker/linkshell-gateway-$VERSION.tar.gz"
      - name: Export mobile JavaScript bundles
        working-directory: apps/client
        run: |
          pnpm exec expo export --platform ios --output-dir build/release-js/ios
          pnpm exec expo export --platform android --output-dir build/release-js/android
      - uses: actions/upload-artifact@v4
        with:
          name: linkshell-prepared-${{ github.sha }}
          path: |
            artifacts/npm/*.tgz
            artifacts/web/
            artifacts/docker/
            artifacts/gateway-health.json
            apps/client/build/release-js/
            docs/site/
            docs/releases/2.3.9.md
          if-no-files-found: error
          retention-days: 30

  mobile:
    if: ${{ inputs.mobile_only }}
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: pnpm -r --filter './packages/*' build
      - name: Prepare native app without publishing
        working-directory: apps/client
        run: node scripts/release.mjs "${{ matrix.platform }}" --prepare-only
      - uses: actions/upload-artifact@v4
        with:
          name: linkshell-mobile-${{ matrix.platform }}-${{ github.sha }}
          path: |
            apps/client/build/release/export/*.ipa
            apps/client/build/release/*.apk
            apps/client/build/release/*.aab
          if-no-files-found: error
          retention-days: 30
