name: Windows desktop

on:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runs_on: windows-latest
          - arch: arm64
            runs_on: windows-11-arm
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify native shortcut creation with a custom home
        working-directory: apps/windows
        run: >-
          node --test --test-name-pattern="^installer transaction: shortcut-home$" test/installer.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: apps/windows/build/webrtc-cache
          key: linkshell-libwebrtc-a545de4-${{ matrix.arch }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          LINKSHELL_WINDOWS_ARCH: ${{ matrix.arch }}
      - run: pnpm typecheck
      - if: matrix.arch == 'x64'
        run: pnpm --filter @linkshell/host exec vitest run test/codex-installation.test.ts test/windows.test.ts test/windows-viewer.test.ts test/windows-video.test.ts test/windows-media.test.ts test/windows-screen-session.test.ts test/screen-session.test.ts test/screen-viewer-session.test.ts test/dev-port.e2e.test.ts test/screen-viewer.test.ts test/screen-pacer.test.ts test/screen-fallback.test.ts test/screen.test.ts test/screen-platform.test.ts test/screen-native-controls.test.ts test/screen-metrics.test.ts test/fusion.test.ts test/fusion-remote.test.ts
      - if: matrix.arch == 'arm64'
        run: pnpm --filter @linkshell/host exec vitest run test/windows.test.ts test/windows-viewer.test.ts test/windows-video.test.ts test/windows-media.test.ts test/windows-screen-session.test.ts test/fusion.test.ts test/fusion-remote.test.ts
      - if: matrix.arch == 'x64'
        run: pnpm --filter linkshell-cli exec vitest run test/desktop.test.ts test/desktop-update.test.ts test/desktop-workspace.test.ts test/daemon.test.ts test/auth.test.ts test/pro-membership.test.ts
      - if: matrix.arch == 'x64'
        run: pnpm --filter @linkshell/desktop-ui exec vitest run --maxWorkers=2
      - if: matrix.arch == 'x64'
        run: pnpm --filter @linkshell/desktop-ui lint
      - if: matrix.arch == 'x64'
        run: pnpm --filter @linkshell/desktop test
      - run: pnpm --filter @linkshell/windows test
      - run: pnpm --filter @linkshell/windows build:standalone -- --arch=${{ matrix.arch }}
        id: windows_bundle
        env:
          LINKSHELL_SMOKE_SHOTS: artifacts/window-shots
          LINKSHELL_WINDOWS_ARCH: ${{ matrix.arch }}
      - name: Exercise Windows automatic update, rollback and data preservation
        if: github.event_name == 'workflow_dispatch' && matrix.arch == 'x64'
        run: pnpm --filter @linkshell/windows test:update-e2e
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && matrix.arch == 'x64'
        with:
          name: LinkShell-Windows-update-e2e
          path: artifacts/windows-update-e2e
          if-no-files-found: warn
      - name: Exercise real Codex model selection and session option persistence
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && matrix.arch == 'x64' && steps.windows_bundle.outcome == 'success' }}
        timeout-minutes: 12
        run: pnpm --filter @linkshell/windows test:model-ui-e2e
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && matrix.arch == 'x64'
        with:
          name: LinkShell-Windows-model-ui-e2e
          path: artifacts/windows-model-ui-e2e
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: LinkShell-Windows-${{ matrix.arch }}-unsigned
          path: |
            artifacts/LinkShell-Setup-*-windows-${{ matrix.arch }}.exe
            artifacts/LinkShell-*-windows-${{ matrix.arch }}.zip
            artifacts/*.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LinkShell-Windows-window-shots-${{ matrix.arch }}
          path: artifacts/window-shots
          if-no-files-found: ignore
